name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Release তৈরি করতে লাগবে

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTree-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: APK-এর নাম ঠিক করা
        run: cp app/build/outputs/apk/release/app-release.apk "FamilyTree-v1.${{ github.run_number }}.apk"

      - name: GitHub Release তৈরি
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "FamilyTree-v1.${{ github.run_number }}.apk" \
            --title "আমার বংশতালিকা v1.${{ github.run_number }}" \
            --notes "স্বয়ংক্রিয় বিল্ড (commit ${{ github.sha }})" \
            --target "${{ github.sha }}"
